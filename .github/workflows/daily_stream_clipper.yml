name: Autonomous Snickerly Streamer Clipper & Multi-Platform Publisher

on:
  schedule:
    # Runs every 30 minutes 24/7 for ultra-fast GTA VI streamer clipping & publishing
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      auto_discover:
        description: 'Auto-discover live GTA streamers >= 30,000 viewers'
        required: true
        default: true
        type: boolean
      streamer_id:
        description: 'Target specific streamer if auto-discover is false'
        required: false
        default: 'xqc'
        type: choice
        options:
          - xqc
          - alanzoka
          - djmariio
          - trymacs
          - montanablack88
          - kaicenat
          - ishowspeed
      publish:
        description: 'Publish automatically to FB Reels & IG Reels'
        required: true
        default: true
        type: boolean

jobs:
  clip_and_publish:
    name: Snickerly Stream Clip & Multi-Platform Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snickerly Clipper Engine (24/7 GTA VI 30k+ Viewers)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          AUTO_DISCOVER: ${{ github.event.inputs.auto_discover || 'true' }}
          STREAMER_ID: ${{ github.event.inputs.streamer_id || 'xqc' }}
          PUBLISH_FLAG: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [ "$AUTO_DISCOVER" = "true" ]; then
            python stream_clipper/streamer_clipper.py --auto-discover --min-viewers 30000 --publish
          else
            python stream_clipper/streamer_clipper.py --streamer "$STREAMER_ID" --publish
          fi
