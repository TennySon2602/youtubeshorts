name: Autonomous Snickerly Streamer Clipper & Multi-Platform Publisher

on:
  schedule:
    # Runs every 15 minutes 24/7 for ultra-fast GTA VI streamer clipping & publishing
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Choose Execution Mode'
        required: true
        default: 'auto_batch'
        type: choice
        options:
          - 'auto_batch'
          - 'matrix_parallel'
          - 'single_streamer'
      max_streamers:
        description: 'Number of streamers to process in auto_batch mode'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'
      specific_streamer:
        description: 'Target Streamer (if single_streamer mode selected)'
        required: false
        default: 'kaicenat'
        type: choice
        options:
          - 'kaicenat'
          - 'caseoh_'
          - 'alanzoka'
          - 'xqc'
          - 'djmariio'
          - 'trymacs'
          - 'montanablack88'
          - 'theburntpeanut'
          - 'ohnepixel'
          - 'ishowspeed'
          - 'jynxzi'
      publish:
        description: 'Publish automatically to Facebook Reels & Instagram Reels'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # 1. Batch Mode (Default & Scheduled): Auto-discovers & processes top N streamers >= 30,000 viewers
  batch_clipper:
    name: Auto Batch Stream Clipper (Top N Streamers)
    if: github.event_name == 'schedule' || github.event.inputs.execution_mode == 'auto_batch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Streamer Clipper Engine (Chat Spike Detection Enabled)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          MAX_STREAMERS: ${{ github.event.inputs.max_streamers || '3' }}
        run: |
          PUB_ARG="--publish"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "false" ]; then
            PUB_ARG=""
          fi
          echo "🚀 Executing Streamer Clipper with PUB_ARG='$PUB_ARG' and MAX_STREAMERS='$MAX_STREAMERS'..."
          python stream_clipper/streamer_clipper.py --auto-discover --min-viewers 30000 --max-streamers "$MAX_STREAMERS" $PUB_ARG

      - name: Commit & Push Processed Clips History
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add stream_clipper/config/processed_clips.json || true
          git commit -m "chore: save processed clips history [skip ci]" || echo "No new processed clips"
          git push origin main || echo "Git push skipped"

  # 2. Matrix Parallel Mode: Runs parallel Ubuntu runners concurrently for Top Streamers
  matrix_parallel_clipper:
    name: Parallel Runner (${{ matrix.streamer }})
    if: github.event.inputs.execution_mode == 'matrix_parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        streamer: [kaicenat, caseoh_, alanzoka, xqc, montanablack88]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Streamer Clipper for ${{ matrix.streamer }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          PUB_ARG="--publish"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "false" ]; then
            PUB_ARG=""
          fi
          python stream_clipper/streamer_clipper.py --streamer "${{ matrix.streamer }}" $PUB_ARG

  # 3. Single Streamer Mode: Process one specifically selected streamer
  single_clipper:
    name: Single Runner (${{ github.event.inputs.specific_streamer }})
    if: github.event.inputs.execution_mode == 'single_streamer'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Streamer Clipper for ${{ github.event.inputs.specific_streamer }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          PUB_ARG="--publish"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "false" ]; then
            PUB_ARG=""
          fi
          python stream_clipper/streamer_clipper.py --streamer "${{ github.event.inputs.specific_streamer }}" $PUB_ARG

      - name: Commit & Push Processed Clips History
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add stream_clipper/config/processed_clips.json || true
          git commit -m "chore: save processed clips history [skip ci]" || echo "No new processed clips"
          git push origin main || echo "Git push skipped"
