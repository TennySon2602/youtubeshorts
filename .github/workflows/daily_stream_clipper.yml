name: Autonomous Snickerly Streamer Clipper & Multi-Platform Publisher

on:
  schedule:
    # Runs every 30 minutes 24/7 for ultra-fast GTA VI streamer clipping & publishing
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      streamer_id:
        description: 'Select Streamer or choose auto'
        required: true
        default: 'kaicenat'
        type: choice
        options:
          - auto
          - kaicenat
          - ishowspeed
          - xqc
          - caseoh
          - jynxzi
          - fanum
          - ray
          - adin_ross
          - mixigaming
          - thaygiaoba
      clip_url:
        description: 'Optional direct clip URL (Twitch/YouTube/Kick). Leave empty for auto-trending.'
        required: false
        default: ''
      publish:
        description: 'Publish automatically to YouTube, FB Reels, IG Reels'
        required: true
        default: true
        type: boolean

jobs:
  clip_and_publish:
    name: Snickerly Stream Clip & Multi-Platform Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp python-dotenv

      - name: Run Snickerly Clipper Engine
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          STREAMER_ID: ${{ github.event.inputs.streamer_id || 'kaicenat' }}
          CLIP_URL: ${{ github.event.inputs.clip_url || '' }}
          PUBLISH_NOW: ${{ github.event.inputs.publish || 'true' }}
        run: |
          python stream_clipper/streamer_clipper.py
