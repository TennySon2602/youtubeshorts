name: StreamClipper 24/7 Autonomous Multi-Platform Pipeline

on:
  schedule:
    # Runs every 15 minutes 24/7 for autonomous GTA VI streamer clipping & publishing
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Choose Execution Mode'
        required: true
        default: 'auto_batch'
        type: choice
        options:
          - 'auto_batch'
          - 'single_streamer'
          - 'direct_url'
      max_streamers:
        description: 'Number of streamers to process in auto_batch mode'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      specific_streamer:
        description: 'Target Streamer (if single_streamer mode selected)'
        required: false
        default: 'caseoh_'
        type: choice
        options:
          - 'caseoh_'
          - 'kaicenat'
          - 'alanzoka'
          - 'xqc'
          - 'djmariio'
          - 'trymacs'
          - 'montanablack88'
          - 'theburntpeanut'
          - 'ohnepixel'
          - 'ishowspeed'
          - 'jynxzi'
      stream_url:
        description: 'Direct stream, VOD, or clip URL (if direct_url mode selected)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish automatically to YouTube Shorts, Facebook Reels & Instagram Reels'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  streamclipper_runner:
    name: StreamClipper Pipeline (AI Story Clips & Multi-Platform Publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Dependencies & StreamClipper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify StreamClipper Doctor
        run: |
          streamclipper doctor

      - name: Run StreamClipper Autonomous Pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          PUB_ARG="--publish"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" = "false" ]; then
            PUB_ARG=""
          fi

          MODE="${{ github.event.inputs.execution_mode || 'auto_batch' }}"
          URL_VAL="${{ github.event.inputs.stream_url }}"
          STREAMER_VAL="${{ github.event.inputs.specific_streamer || 'caseoh_' }}"
          MAX_S="${{ github.event.inputs.max_streamers || '3' }}"

          echo "🚀 Starting StreamClipper Pipeline [Mode: $MODE] [Publish: $PUB_ARG]..."

          if [ "$MODE" = "direct_url" ] && [ -n "$URL_VAL" ]; then
            echo "Processing direct URL: $URL_VAL"
            python streamclipper_pipeline.py --url "$URL_VAL" $PUB_ARG
          elif [ "$MODE" = "single_streamer" ]; then
            echo "Processing single streamer: $STREAMER_VAL"
            python streamclipper_pipeline.py --streamer "$STREAMER_VAL" $PUB_ARG
          else
            echo "Running auto-discovery (min 30k viewers, max $MAX_S streamers)..."
            python streamclipper_pipeline.py --auto-discover --min-viewers 30000 --max-streamers "$MAX_S" $PUB_ARG
          fi

      - name: Commit & Push Processed Clips History
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add stream_clipper/config/processed_clips.json || true
          git commit -m "chore: record processed clips history [skip ci]" || echo "No new processed clips"
          git push origin main || echo "Git push skipped"
