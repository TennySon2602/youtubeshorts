name: Daily Automated GTA VI Gameplay & Lore Shorts

on:
  schedule:
    # Runs everyday at 14:00 UTC (21:00 Vietnam Time / Prime Gaming Time)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'GTA VI Lore Topic (Select one or choose auto for daily rotation)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - lucia_ankle_monitor
          - leonida_map_scale
          - police_ai_system
          - social_media_mechanic
          - bonnie_clyde_tragedy
          - physics_and_details
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  generate_and_publish_gta6:
    name: Generate GTA VI Short & Upload to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & TrueType Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GTA VI Video Pipeline and Auto-Publish
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          TOPIC_ID: ${{ github.event.inputs.topic_id || '' }}
        run: |
          python gta6_pipeline.py
