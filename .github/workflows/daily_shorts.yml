name: Daily Automated YouTube Shorts

on:
  schedule:
    # Runs everyday at 12:00 UTC (19:00 Vietnam Time / 07:00 EST)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube Video Privacy'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  generate_and_publish:
    name: Generate Video & Upload to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Pipeline and Auto-Publish
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          OXION_API_KEY: ${{ secrets.OXION_API_KEY }}
          UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          python pipeline.py
